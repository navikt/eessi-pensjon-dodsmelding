kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: eessi-pensjon-dodsmelding-q2
  namespace: eessipensjon
  labels:
    team: eessipensjon
spec:
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  envFrom:
    - secret: dodsmelding-dev #secret name in Google Secret Manager
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: eessi-pensjon-dodsmelding-q2
          namespace: eessipensjon
          cluster: dev-gcp
      external:
        - host: pensjon-q2.pensjon-pen-q2
        - host: pensjon-pen-q2.dev-fss-pub.nais.io
        - host: pensjon-psak-q2.dev-fss-pub.nais.io
    inbound:
      rules:
        - application: pensjon-psak-q2
          namespace: pensjon-q2
          cluster: dev-gcp
  gcp:
    buckets:
      - name: eessi-pensjon-dodsmelding-q2
        uniformBucketLevelAccess: true

  webproxy: true
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: test
    - name: ENV
      value: q2

    - name: GCP_BUCKET_UTL_YTELSE
      value: eessi-pensjon-dodsmelding-q2

    - name: EUX_RINA_API_V1_URL
      value: https://eux-rina-api-q2.intern.dev.nav.no/cpi

    - name: PESYS_URL
      value: https://pensjon-pen-q2.dev-fss-pub.nais.io/pen/api/eessi/v2

    - name: SAF_GRAPHQL_URL
      value: https://saf-q2.dev-fss-pub.nais.io/graphql

    - name: SAF_HENTDOKUMENT_URL
      value: https://saf-q2.dev-fss-pub.nais.io/rest/hentdokument

    - name: PDL_URL
      value: https://pdl-api.dev-fss-pub.nais.io/graphql

    - name: KAFKA_PDLHENDELSE_TOPIC
      value: pdl.leesah-v1
    - name: KAFKA_GROUP_ID
      value: eessi-pensjon-dodsmelding-q2


  image: {{ image }}
  ingresses:
    - https://eessi-pensjon-dodsmelding-q2.intern.dev.nav.no
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  liveness:
    path: /internal/isalive
    port: 8080
    initialDelay: 20
  readiness:
    path: /internal/isready
    port: 8080
    initialDelay: 20
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 80
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

